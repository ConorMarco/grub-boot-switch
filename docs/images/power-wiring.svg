<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>Power button wiring: two Y splitters on the motherboard's power switch pins</title>
  <rect x="0.5" y="0.5" width="759" height="399" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <text x="30" y="36" font-size="16" font-weight="600">Power button wiring</text>
  <text x="30" y="56" fill="#59636e">The two buttons are wired in parallel, so either one turns the PC on or off.</text>

  <!-- Motherboard header -->
  <rect x="30" y="150" width="104" height="100" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="74" y="204" text-anchor="middle" font-weight="600">PWR_SW</text>
  <rect x="112" y="172" width="16" height="16" fill="#c9a227" stroke="#8a6d00"/>
  <rect x="112" y="212" width="16" height="16" fill="#c9a227" stroke="#8a6d00"/>
  <text x="82" y="278" text-anchor="middle">Motherboard</text>
  <text x="82" y="294" text-anchor="middle">front-panel header</text>

  <!-- Wire B (blue), drawn first so wire A crosses over it -->
  <g fill="none" stroke="#1c7ed6" stroke-width="4" stroke-linejoin="round">
    <path d="M160,220 H260"/>
    <path d="M260,220 V95 H470"/>
    <path d="M260,220 V325 H560"/>
  </g>

  <!-- Wire A (orange), with a white halo where it crosses wire B -->
  <path d="M245,180 H275" fill="none" stroke="#ffffff" stroke-width="10"/>
  <g fill="none" stroke="#e8590c" stroke-width="4" stroke-linejoin="round">
    <path d="M160,180 H300"/>
    <path d="M300,180 V115 H470"/>
    <path d="M300,180 V305 H560"/>
  </g>

  <!-- Splitter housings on the pins, and the split points -->
  <rect x="128" y="170" width="32" height="20" rx="2" fill="#1f2937"/>
  <rect x="128" y="210" width="32" height="20" rx="2" fill="#1f2937"/>
  <circle cx="300" cy="180" r="6" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="260" cy="220" r="6" fill="#1c7ed6" stroke="#ffffff" stroke-width="2"/>
  <text x="312" y="222">Y splitters,</text>
  <text x="312" y="238">one per pin</text>

  <!-- Case button -->
  <rect x="470" y="85" width="26" height="40" rx="2" fill="#1f2937"/>
  <g stroke="#6b7280" stroke-width="3">
    <path d="M496,95 H560"/>
    <path d="M496,115 H560"/>
  </g>
  <rect x="560" y="72" width="176" height="66" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="648" y="100" text-anchor="middle" font-weight="600">Case power button</text>
  <text x="648" y="118" text-anchor="middle" fill="#59636e">front panel, unchanged</text>

  <!-- Case wall -->
  <path d="M520,262 V378" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="520" y="254" text-anchor="middle" fill="#59636e">case wall</text>
  <text x="400" y="352" text-anchor="middle" fill="#59636e">extension leads</text>

  <!-- Joint and desk button -->
  <rect x="560" y="295" width="30" height="40" rx="2" fill="#1f2937"/>
  <path d="M575,295 V335" stroke="#6b7280" stroke-width="1.5"/>
  <text x="575" y="356" text-anchor="middle" fill="#59636e">Dupont joint</text>
  <g stroke="#6b7280" stroke-width="3">
    <path d="M590,305 H630"/>
    <path d="M590,325 H630"/>
  </g>
  <rect x="630" y="282" width="106" height="66" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="683" y="310" text-anchor="middle" font-weight="600">Desk power</text>
  <text x="683" y="328" text-anchor="middle" font-weight="600">button</text>
</svg>
